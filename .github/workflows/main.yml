name: Build LegendaryPlugin

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build JAR with Maven
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Cài đặt JDK 21 (khớp maven.compiler.target trong pom.xml)
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      # 3. Cấp quyền thực thi cho mvnw (nếu có Maven Wrapper)
      - name: Make mvnw executable
        run: chmod +x mvnw || true

      # 4. Build với Maven (dùng mvnw nếu có, fallback sang mvn)
      - name: Build with Maven
        run: |
          if [ -f ./mvnw ]; then
            ./mvnw -B clean package --file pom.xml
          else
            mvn -B clean package --file pom.xml
          fi

      # 5. Upload artifact (jar) để tải về từ tab Actions
      - name: Upload Plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: LegendaryPlugin
          path: target/LegendaryPlugin-*.jar
          if-no-files-found: error
          retention-days: 30

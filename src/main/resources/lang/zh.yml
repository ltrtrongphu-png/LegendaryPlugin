  tampering-detected: "<red>检测到代码篡改 — 反作弊进入锁定模式。"

modules:
  enabled: "<green>模块 <white>%module% <green>已启用。"
  disabled: "<yellow>模块 <white>%module% <yellow>已禁用。"
  reloaded: "<green>模块 <white>%module% <green>已重新加载。"
  not-found: "<red>未找到模块 <white>%module%<red>。"

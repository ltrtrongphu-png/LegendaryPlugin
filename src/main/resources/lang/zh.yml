  verified: "<green>验证完成。欢迎！"
  timeout: "<red>验证超时。请重新连接。"

security:
  lockdown-enabled: "<red>DDoS锁定已启用。仅白名单IP可加入。"
  lockdown-disabled: "<green>DDoS锁定已禁用。"

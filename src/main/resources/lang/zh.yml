  rate-limited: "<red>[AntiInfiniteWater] <gray>你放水太快了。请放慢速度。"

anticheat:
  alert-format: "<gray>[<gold>AC<gray>] <yellow>%player% <gray>触犯 <white>%check% <gray>(VL <red>%vl%/%threshold%)"
  ban-broadcast: "<red>%player% <gray>因 <white>%reason% <gray>被封禁"
  lockout: "<red>%player% <gray>因可疑行为被冻结。"
  lockout-released: "<green>%player% <gray>已被解除冻结。"

verification:
  kick-too-many: "<red>来自您网络的连接尝试过多。请稍后再试。"
  prompt-move: "<yellow>请移动以验证您是人类。"

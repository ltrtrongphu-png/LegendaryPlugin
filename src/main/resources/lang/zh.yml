  exempt: "<green>%player% <gray>已豁免AntiAfkBot检查。"

antichunkban:
  prefix: "<gray>[<red>AntiChunkBan<gray>] "
  quarantine-warning: "<red>[AntiChunkBan] <gray>该区块已被隔离以确保安全。你无法进入。"
  danger-detected: "<red>[AntiChunkBan] <gray>检测到危险区块！正在将你转移到安全区域。"
  teleport-cancelled: "<red>[AntiChunkBan] <gray>传送目的地在隔离区块中。传送已取消。"
  teleport-redirected: "<red>[AntiChunkBan] <gray>传送目的地危险！正在重定向到安全区域。"
  login-redirected: "<red>[AntiChunkBan] <gray>你的登录位置不安全。你已被转移到安全区域。"

antiinfinitewater:
  prefix: "<gray>[<red>AntiInfiniteWater<gray>] "

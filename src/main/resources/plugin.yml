name: LegendaryPlugin
version: '${project.version}'
main: com.legendary.plugin.LegendaryPlugin
api-version: '1.21'
author: WhiteBlackMC709
description: >
  Unified anti-cheat, anti-X-ray/ESP protection, server optimization and
  join-verification platform. Pro edition with 50 heuristic checks including
  composite heuristic fusion engine, behavioral profiling, TPS-adaptive
  sensitivity, chunk heatmap optimization, memory pressure monitoring,
  replay recording, threat dashboard, AI-assisted anomaly detection, packet
  fingerprinting, and modular architecture. Result of extensive research
  across 12 major versions.
website: https://legendaryplugin.dev

# Copyright (c) WhiteBlackMC709 — All rights reserved.
# Unauthorized copying, redistribution, modification, or resale of this plugin
# or any portion of its source code is strictly prohibited.

# All third-party integrations are optional (soft-depend) and every module
# gracefully disables itself if the dependency is missing.
softdepend: [ProtocolLib, PlaceholderAPI]
load: POSTWORLD

commands:
  legendary:
    description: Main LegendaryPlugin command - status, module control, GUI, reports.
    aliases: [lp, legend]
    permission: legendary.admin
    usage: |
      /<command> help
      /<command> status
      /<command> module <list|enable|disable|reload> [module]
      /<command> gui
      /<command> simulate <mild|moderate|severe|normal>
      /<command> topchunks [world] [limit]
      /<command> history
      /<command> report
  legendaryac:
    description: Anti-cheat controls (violation levels, exemptions, replay, threat dashboard).
    aliases: [lac, bab]
    permission: legendary.anticheat.admin
    usage: |
      /<command> vl <player> [check]
      /<command> exempt <player>
      /<command> reset <player> [check]
      /<command> checkall [player]
      /<command> history <player> [limit]
      /<command> watch <player>
      /<command> replay <list|watch|stop> [player] [index]
      /<command> profile <player>
      /<command> threats
      /<command> bypass <player> <seconds|revoke>
      /<command> bypass-audit [player]
      /<command> release <player>
      /<command> security
      /<command> lockdown <on|off>

permissions:
  legendary.admin:
    description: Full access to every LegendaryPlugin module and command.
    default: op
  legendary.anticheat.admin:
    description: Access to anti-cheat management commands and alerts.
    default: op
  legendary.anticheat.alerts:
    description: Receive real-time anti-cheat violation alerts.
    default: op
  legendary.esp.bypass:
    description: Bypass ESP protection / view-distance restrictions (staff, spectators).
    default: op
  legendary.verification.bypass:
    description: Skip the join-verification limbo stage.
    default: op
  legendary.raidalert.bypass:
    description: Exempt from raid-alert monitoring (trusted players).
    default: false
  legendary.anticheat.lockout.release:
    description: Release a player frozen by the anti-cheat lockout system.
    default: op
  legendary.security.alerts:
    description: Receive security alerts for reverse-engineering and DDoS attempts.
    default: op
  legendary.bypass.ddos:
    description: Bypass DDoS emergency lockdown to join the server.
    default: op
